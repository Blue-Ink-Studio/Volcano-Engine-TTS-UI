<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>火山 TTS · 安装引导</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <!-- 明暗自适应:加载前设 data-theme,刷新不闪(STAGE5 起 /setup 也支持明暗 + 手动锁定) -->
    <script>try{var t=localStorage.getItem('ttsTheme')||'auto',d=t==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):t;document.documentElement.setAttribute('data-theme',d)}catch(e){}</script>
    <link rel="stylesheet" href="/dashboard/admin.css">
    <style>
        /* ===== 安装分步专用(复用 admin.css 变量,明暗自动适配) ===== */
        .setup-steps { display: flex; align-items: center; gap: 0; margin: 22px 0 20px; }
        .setup-step { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
        .setup-step-num {
            width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 600;
            background: var(--bg-elev); color: var(--text-mute); border: 1px solid var(--border);
            transition: all .15s;
        }
        .setup-step.active .setup-step-num { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
        .setup-step.done .setup-step-num { background: var(--success-soft); color: var(--success); border-color: rgba(34,197,94,.3); }
        .setup-step-label { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .setup-step.active .setup-step-label, .setup-step.done .setup-step-label { color: var(--text); font-weight: 500; }
        .setup-line { flex: 1; height: 1px; background: var(--border); margin: 0 12px; min-width: 14px; }
        .setup-step.done + .setup-line { background: var(--accent); opacity: .4; }

        .setup-panel { text-align: left; }
        .setup-panel .step-title { font-size: 16px; font-weight: 600; }
        .setup-panel .step-sub { font-size: 12px; color: var(--text-dim); margin: 6px 0 18px; line-height: 1.6; }

        .setup-token-box {
            background: var(--bg-elev); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 14px; margin-bottom: 14px;
            font-size: 12px; color: var(--text-dim); line-height: 1.7;
        }
        .setup-token-box b { color: var(--accent); font-family: ui-monospace, SFMono-Regular, monospace; }

        .setup-confirm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .setup-confirm-item { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
        .setup-confirm-item .k { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
        .setup-confirm-item .v { font-size: 13px; color: var(--text); font-family: ui-monospace, SFMono-Regular, monospace; word-break: break-all; }

        .theme-toggle {
            position: absolute; top: 20px; right: 22px;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-dim);
            cursor: pointer; font-size: 15px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .login-card { position: relative; max-width: 520px; width: 100%; }
    </style>
</head>
<body>
    <div id="app">
        <div class="login-screen">
            <div class="login-card">
                <button class="theme-toggle" :title="'切换主题(当前: '+themeLabel+'),点击循环 浅色/深色/跟随系统'" @click="cycleTheme">{{ themeIcon }}</button>

                <div class="login-logo">TTS</div>
                <h1>首次安装</h1>
                <div class="sub">创建超级管理员账号。渠道凭证、音色在建站后到渠道管理页配置。</div>

                <!-- 分步条 -->
                <div class="setup-steps">
                    <div class="setup-step" :class="{ active: step===1, done: step>1 }">
                        <div class="setup-step-num">1</div>
                        <div class="setup-step-label">安装 Token</div>
                    </div>
                    <div class="setup-line"></div>
                    <div class="setup-step" :class="{ active: step===2, done: step>2 }">
                        <div class="setup-step-num">2</div>
                        <div class="setup-step-label">创建超管</div>
                    </div>
                    <div class="setup-line"></div>
                    <div class="setup-step" :class="{ active: step===3 }">
                        <div class="setup-step-num">3</div>
                        <div class="setup-step-label">完成安装</div>
                    </div>
                </div>

                <div v-if="errorMsg" class="login-err">⚠ {{ errorMsg }}</div>

                <!-- 第 1 步:安装 Token -->
                <template v-if="step === 1">
                    <div class="setup-panel">
                        <div class="step-title">安装 Token</div>
                        <div class="step-sub">用于确认你有权限执行本次安装。Token 是<strong>一次性</strong>的：每次启动服务都会重新生成并打印在启动日志里，从日志中复制粘贴即可。</div>
                        <div class="setup-token-box">
                            启动日志形如：<br><b>[setup] 一次性安装 token: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx</b><br>
                            （公网部署请登录后在设置页配置 <code>admin_key</code>，可作紧急恢复凭证；安装 Token 本身不保存，装完即失效。）
                        </div>
                        <input v-model="form.token" type="password" class="login-input" placeholder="粘贴启动日志里的一次性安装 Token" autocomplete="off" autofocus @keyup.enter="next">
                    </div>
                </template>

                <!-- 第 2 步:创建超管 -->
                <template v-else-if="step === 2">
                    <div class="setup-panel">
                        <div class="step-title">创建超级管理员</div>
                        <div class="step-sub">超管是系统的最高权限账号，可管理用户、渠道与计费。用户名可自定义（避免用默认名），初始余额为 0。</div>
                        <input v-model="form.admin.name" class="login-input" placeholder="超管用户名（自定义，建议非默认名）" autocomplete="username" autofocus>
                        <input v-model="form.admin.password" type="password" class="login-input" placeholder="密码（至少 8 位，非纯空白）" autocomplete="new-password" style="margin-top:10px;">
                        <input v-model="form.admin.confirm" type="password" class="login-input" placeholder="再次输入密码" autocomplete="new-password" style="margin-top:10px;" @keyup.enter="next">
                        <div class="hint" style="text-align:left; margin-top:8px;">创建后即拥有唯一 <b>owner</b> 权限；用户分组默认 <code>default</code>，后续可提升。</div>
                    </div>
                </template>

                <!-- 第 3 步:确认 -->
                <template v-else>
                    <div class="setup-panel">
                        <div class="step-title">确认安装</div>
                        <div class="step-sub">确认以下信息后点击「完成安装」。提交后立即进入正常模式并跳转登录页。</div>
                        <div class="setup-confirm-grid">
                            <div class="setup-confirm-item">
                                <div class="k">超管用户名</div>
                                <div class="v">{{ form.admin.name || '(未填)' }}</div>
                            </div>
                            <div class="setup-confirm-item">
                                <div class="k">初始权限</div>
                                <div class="v">owner · group=default · 余额 0</div>
                            </div>
                        </div>
                        <div class="setup-token-box" style="margin-top:12px;">
                            💡 <b>建议</b>：安装完成后登录后台，在「设置」页配置 <code>admin_key</code>。它是紧急恢复凭证 —— 若 owner 忘记密码，只有它能救回系统。
                        </div>
                    </div>
                </template>

                <!-- 底部导航 -->
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px;">
                    <button class="btn" @click="prev" :disabled="step === 1 || submitting">← 上一步</button>
                    <button v-if="step < 3" class="btn btn-primary" @click="next">下一步 →</button>
                    <button v-else class="btn btn-primary" @click="submit" :disabled="submitting || !canSubmit">
                        {{ submitting ? '安装中...' : '完成安装' }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    const { createApp, ref, computed, onMounted } = Vue;

    // 明暗偏好(与 admin-shell 同一套键 ttsTheme;auto=跟随系统)
    const applyTheme = () => {
        const t = localStorage.getItem('ttsTheme') || 'auto';
        const d = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.setAttribute('data-theme', d);
    };
    const THEME_SEQ = ['auto', 'light', 'dark'];

    createApp({
        setup() {
            const step = ref(1);
            const form = ref({ token: '', admin: { name: '', password: '', confirm: '' } });
            const errorMsg = ref('');
            const submitting = ref(false);
            const themePref = ref(localStorage.getItem('ttsTheme') || 'auto');

            const themeLabel = computed(() => ({ auto: '跟随', light: '浅色', dark: '深色' }[themePref.value] || themePref.value));
            const themeIcon = computed(() => ({ auto: '🌓', light: '☀️', dark: '🌙' }[themePref.value] || '🌓'));
            const canSubmit = computed(() => form.value.admin.name && form.value.admin.password);

            const cycleTheme = () => {
                const i = THEME_SEQ.indexOf(themePref.value);
                themePref.value = THEME_SEQ[(i + 1) % THEME_SEQ.length];
                localStorage.setItem('ttsTheme', themePref.value);
                applyTheme();
            };

            const next = () => {
                errorMsg.value = '';
                if (step.value === 1) {
                    if (!form.value.token.trim()) { errorMsg.value = '请粘贴启动日志里的一次性安装 Token'; return; }
                } else if (step.value === 2) {
                    const name = form.value.admin.name.trim();
                    const pwd = form.value.admin.password;
                    if (!name) { errorMsg.value = '请填写超管用户名'; return; }
                    if (name.length > 64) { errorMsg.value = '用户名过长'; return; }
                    if (!pwd || !pwd.trim() || pwd.length < 8) { errorMsg.value = '密码长度至少 8 位，且不能为纯空白'; return; }
                    if (pwd !== form.value.admin.confirm) { errorMsg.value = '两次输入的密码不一致'; return; }
                }
                step.value = Math.min(3, step.value + 1);
            };
            const prev = () => { errorMsg.value = ''; step.value = Math.max(1, step.value - 1); };

            const submit = async () => {
                errorMsg.value = '';
                if (!canSubmit.value) return;
                submitting.value = true;
                try {
                    const r = await axios.post('/api/setup', {
                        token: form.value.token.trim(),
                        admin: {
                            name: form.value.admin.name.trim(),
                            password: form.value.admin.password,
                        },
                    });
                    // D7:装完跳统一登录页,用超管登录
                    window.location.href = (r.data && r.data.redirect) || '/login';
                } catch (e) {
                    const code = e.response?.data?.error?.code;
                    const msg = e.response?.data?.error?.message || e.message;
                    const map = {
                        invalid_token: '安装 Token 无效或已过期，请从最新启动日志复制。',
                        weak_password: '密码不合规：长度至少 8 位，且不能为纯空白。',
                        user_exists: '该用户名已存在，请换一个。',
                        invalid_name: '用户名不合法。',
                    };
                    errorMsg.value = (map[code] || msg || '安装失败') ;
                    submitting.value = false;
                }
            };

            // 已在正常模式(双保险;/setup 路由装完后本应已 302)则跳登录
            onMounted(async () => {
                applyTheme();
                try {
                    const r = await axios.get('/api/setup/status');
                    if (r.data && r.data.installed === true) {
                        window.location.href = '/login';
                    }
                } catch (e) { /* 接口不可用则忽略 */ }
            });

            return { step, form, errorMsg, submitting, canSubmit, themeLabel, themeIcon, cycleTheme, next, prev, submit };
        },
    }).mount('#app');
    </script>
</body>
</html>
