version: '3.8'

services:
  tts-api:
    build: .
    container_name: tts-api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - BYTEDANCE_TTS_API_KEY=${BYTEDANCE_TTS_API_KEY}
      - BYTEDANCE_TTS_RESOURCE_ID=${BYTEDANCE_TTS_RESOURCE_ID}
      - BYTEDANCE_TTS_SPEAKER=${BYTEDANCE_TTS_SPEAKER}
      - BYTEDANCE_TTS_TIMEOUT=${BYTEDANCE_TTS_TIMEOUT:-30s}
      - OPENAI_TTS_API_KEY=${OPENAI_TTS_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
